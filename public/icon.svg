<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d1d0c" />
      <stop offset="100%" stop-color="#140602" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="dieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fdf6e7" />
      <stop offset="100%" stop-color="#e2c89f" />
    </linearGradient>
    <radialGradient id="pipGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldBorder)" stroke-width="8" opacity="0.8" />

  <!-- Authentic 8-Pointed Arabesque Rosette -->
  <polygon points="256,48 290,180 422,180 316,256 356,388 256,310 156,388 196,256 90,180 222,180" fill="#b45309" opacity="0.25" />

  <!-- Pair of Luxury Dice in 3D perspective -->
  <!-- Left Die -->
  <g transform="translate(100, 150) rotate(-12, 110, 110)">
    <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#dieGrad)" stroke="#b8935c" stroke-width="4" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))" />
    <!-- 5 Pips (الدستة) -->
    <circle cx="55" cy="55" r="16" fill="url(#pipGrad)" />
    <circle cx="145" cy="55" r="16" fill="url(#pipGrad)" />
    <circle cx="100" cy="100" r="18" fill="#b91c1c" />
    <circle cx="55" cy="145" r="16" fill="url(#pipGrad)" />
    <circle cx="145" cy="145" r="16" fill="url(#pipGrad)" />
  </g>

  <!-- Right Die -->
  <g transform="translate(230, 190) rotate(14, 110, 110)">
    <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#dieGrad)" stroke="#b8935c" stroke-width="4" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.85))" />
    <!-- 6 Pips (الدوش) -->
    <circle cx="55" cy="48" r="15" fill="url(#pipGrad)" />
    <circle cx="145" cy="48" r="15" fill="url(#pipGrad)" />
    <circle cx="55" cy="100" r="15" fill="url(#pipGrad)" />
    <circle cx="145" cy="100" r="15" fill="url(#pipGrad)" />
    <circle cx="55" cy="152" r="15" fill="url(#pipGrad)" />
    <circle cx="145" cy="152" r="15" fill="url(#pipGrad)" />
  </g>
</svg>
